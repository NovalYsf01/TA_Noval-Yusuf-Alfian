name: warga20
description: "Sistem Pelayanan Masyarakat RT 20"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # Typography
  google_fonts: ^6.2.1

  # Storage
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.0.0

  # Networking
  http: ^1.2.2

  # UI helpers
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1

  # Internationalization
  intl: ^0.20.2

  # Navigation & External
  url_launcher: ^6.3.0

  # File
  file_picker: ^10.3.3
  path_provider: ^2.1.6
  open_filex: ^4.7.0

  # Firebase
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0

  # Local notification untuk Emergency Alert
  flutter_local_notifications: ^22.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/